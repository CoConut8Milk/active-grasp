perception_node:
  ros__parameters:
    use_sim_time: true
    depth_topic: /ag_camera/depth/image_raw
    color_topic: /ag_camera/image_raw
    camera_info_topic: /ag_camera/depth/camera_info
    joint_states_topic: /joint_states
    base_frame: base_link
    camera_frame: camera_link
    grid_height: 48
    grid_width: 48
    workspace_x_min: 0.20
    workspace_x_max: 0.70
    workspace_y_min: -0.25
    workspace_y_max: 0.25
    # 只保留桌面上的真实结构（物体 ≤4.5 cm、边界墙 6 cm）。机械臂自身连杆在
    # 0.3 m 以上，若把上限设成 0.35，手臂进入视野时会被当成"34 cm 高的物体"
    # 让策略去抓（这类假目标会把整轮 episode 带偏）。
    z_max: 0.12
    max_age: 8
    # 判定"机械臂已静止"的速度阈值（rad/s 或 m/s）。Gazebo Classic 用位置差分
    # 报告关节速度，仿真慢于实时（WSL 下常见 real-time factor≈0.3）时会残留
    # 0.05~0.1 的噪声速度；真正的轨迹运动在 1.0 以上。取 0.15 既能忽略噪声，
    # 又不会把运动中误判为静止。
    stationary_velocity: 0.15
    fresh_frame_timeout: 1.5
    calib_max_depth: 1.1
    # 深度图最外圈像素在 Gazebo Classic 里不可靠，会形成"永远存在的高点"
    # （每次 episode 都指向同一个角落格子）。这些像素直接丢弃。
    valid_border: 3
    # 相机像素轴与相机坐标系的关系（Gazebo Classic 渲染的是"相机看到的画面"：
    # 图像向右 = 相机 -y，图像向下 = 相机 -z）。水平方向的正负号无法从一张
    # 水平桌面的深度图里观测出来（镜像后的桌面依然是平的），所以这里按约定
    # 固定；竖直方向由启动标定实测（可观测），用来判断相机是否倒装。
    u_sign: -1.0
    # 相机改为沿 -tool z（与手指同向）后，图像竖直方向翻转，v_sign 变 +1；
    # 水平方向（-y_cam）不受影响，仍为 -1。
    v_sign: 1.0
    hfov: 1.047197551
    image_width: 320
    image_height: 240
